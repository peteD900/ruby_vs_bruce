<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Data - {{ file_name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 600px; margin: auto; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 20px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Update Data - {{ file_name }}</h1>
    <form action="/update/{{ file_name }}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ request.args.get('name', '') }}" required>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ request.args.get('date', '') }}" required>

        <label for="height">Height (cm):</label>
        <input type="number" id="height" name="height" value="{{ request.args.get('height', '') }}">

        <label for="weight">Weight (g):</label>
        <input type="number" id="weight" name="weight" value="{{ request.args.get('weight', '') }}">

        <label for="head_circ">Head Circumference (cm):</label>
        <input type="number" id="head_circ" name="head_circ" value="{{ request.args.get('head_circ', '') }}">

        <button type="submit">Save</button>
    </form>
    <a href="/">Back to list</a>
</body>
</html>
